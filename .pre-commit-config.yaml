# Checks that run on every `git commit` (like Husky / Overcommit). Set up once per clone:
#   uv run pre-commit install
# Run them by hand on everything:
#   uv run pre-commit run --all-files
# External hooks are pinned to a commit SHA (`pre-commit autoupdate --freeze`), the version in a comment.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]   # two trailing spaces are a line break in markdown
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files       # default limit 500 kB: data and models don't belong in git
        exclude: ^uv\.lock$                # the lock file is large but must be committed

  # Secret scanner: blocks a commit that contains something shaped like a key or password.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks

  # Ruff from uv.lock (`uv run`), so the hook and `uv run ruff` can never be different versions.
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
